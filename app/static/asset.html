<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenField · Expediente de activo</title>
<link rel="stylesheet" href="/static/css/openfield.css">
</head>
<body>
<header class="of-topbar">
  <a class="of-brand" href="/"><span class="of-logo"></span> OpenField</a>
  <nav style="display:flex; gap:var(--of-space-2)">
    <a class="of-nav-link secondary" href="/admin/">Administración</a>
    <a class="of-nav-link" href="/capture/">+ Ir a captura</a>
  </nav>
</header>

<main class="of-shell">
  <nav class="of-breadcrumb"><a href="/">Dashboard</a> › <span id="crumb-asset">Activo</span>
    <label style="margin-left:auto; font-size:0.85rem"><input type="checkbox" id="show-deleted"> Mostrar eliminados</label>
  </nav>

  <section id="asset-summary" class="of-card">
    <div class="of-empty"><div class="of-empty-icon">⏳</div><p>Cargando expediente…</p></div>
  </section>

  <section id="datasheet-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Ficha técnica</h2>
    <div id="datasheet-hierarchy" style="margin-bottom:var(--of-space-3)"></div>
    <div style="overflow-x:auto">
      <table class="of-table">
        <thead><tr><th>Atributo</th><th>Valor</th><th>Verificación</th><th>Verificado</th></tr></thead>
        <tbody id="datasheet"></tbody>
      </table>
    </div>
    <progress id="verify-progress" class="of-progress" max="100" value="0" style="margin-top:var(--of-space-3)"></progress>
    <p id="verify-progress-legend" class="of-progress-legend"></p>
  </section>

  <section id="identifiers-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Identificadores</h2>
    <div id="identifiers" class="of-chips"></div>
  </section>

  <section id="sessions-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Sesiones</h2>
    <div id="sessions" class="of-list"></div>
  </section>

  <section id="media-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Medios</h2>
    <div id="media-filters" class="of-chips" style="margin-bottom:var(--of-space-3)"></div>
    <div id="media" class="of-gallery"></div>
  </section>

  <section id="observations-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Observaciones</h2>
    <div style="overflow-x:auto">
      <table class="of-table">
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th>Unidad</th><th></th></tr></thead>
        <tbody id="observations"></tbody>
      </table>
    </div>
  </section>

  <section id="transcripts-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Transcripciones</h2>
    <div id="transcripts" class="of-list"></div>
  </section>

  <section id="forms-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Respuestas de formulario</h2>
    <div id="forms" class="of-list"></div>
  </section>

  <section id="history-section" class="of-card" style="display:none">
    <h2 class="of-section-title">Historial</h2>
    <div style="overflow-x:auto">
      <table class="of-table">
        <thead><tr><th>Rev.</th><th>Acción</th><th>Origen</th><th>Fecha</th><th>Motivo</th><th>Cambios</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>
</main>

<script type="module">
import {
  emptyState, escapeHtml, formatDate, mediaCard,
  apiPatch, apiGetDoc, searchAssetsApi, itemActions,
} from "/static/js/dossier-common.js?v=c3";
import { statusBadge, verificationBadge, attrVerificationBadge, DATA_SOURCE_LABELS, photoCategoriesFor } from "/static/js/labels.js?v=c3";

const $ = (id) => document.getElementById(id);
const assetId = location.pathname.replace(/\/$/, "").split("/").pop();
let showDeleted = false;
let _assetType = null;
let _mediaCategory = "";
let _mediaItems = [];

function show(id) { $(id).style.display = ''; }

const ACTION_LABELS = {
  create: "Alta", update: "Edición", status: "Cambio de estado",
  verify: "Verificación", delete: "Eliminación", restore: "Restauración", import: "Importación",
};

function renderAssetSummary(asset, identifiers) {
  $('crumb-asset').textContent = asset.name || asset.id;
  document.title = `OpenField · ${asset.name || asset.id}`;
  const idSummary = identifiers.length
    ? identifiers.map((i) => `${i.type.toUpperCase()}: ${escapeHtml(i.value)}`).join(' · ')
    : 'Sin identificadores registrados';
  const extras = [
    asset.manufacturer ? `${escapeHtml(asset.manufacturer)}${asset.model ? ' ' + escapeHtml(asset.model) : ''}` : '',
    asset.serial_number ? `serie ${escapeHtml(asset.serial_number)}` : '',
    asset.functional_location ? escapeHtml(asset.functional_location) : '',
    asset.criticality ? `criticidad ${asset.criticality}` : '',
    asset.data_source ? `origen: ${DATA_SOURCE_LABELS[asset.data_source] || asset.data_source}` : '',
  ].filter(Boolean).join(' · ');
  $('asset-summary').innerHTML = `
    <h1 class="of-section-title" style="font-size:1.4rem">${escapeHtml(asset.name || asset.id)}</h1>
    <div class="of-chips">
      ${statusBadge(asset.status)}
      ${verificationBadge(asset.verification_status)}
      <span class="of-badge">${escapeHtml(asset.category || 'sin categoría')}</span>
    </div>
    <p style="color:var(--of-text-muted)">${escapeHtml(asset.id)} · ${idSummary}</p>
    ${extras ? `<p style="color:var(--of-text-muted)">${extras}</p>` : ''}
    <p><a href="/admin/#assets?id=${encodeURIComponent(asset.id)}">Editar en Administración →</a></p>
  `;
}

function renderDatasheet(asset, assetType, parent, children) {
  const attrs = (asset.attributes) || {};
  const defs = ((assetType && assetType.attributes) || []).sort((a, b) => (a.order || 0) - (b.order || 0));
  const av = asset.attribute_verification || {};
  if (!assetType && !Object.keys(attrs).length) return;
  show('datasheet-section');

  const parts = [];
  if (parent) parts.push(`Padre: <a href="/assets/${encodeURIComponent(parent.id)}">${escapeHtml(parent.name || parent.id)}</a>`);
  if (assetType) parts.push(`Tipo: ${escapeHtml(assetType.name)}${assetType.equipment_class ? ` (${escapeHtml(assetType.equipment_class)})` : ''}`);
  if (children.length) {
    parts.push('Hijos: ' + children.map((c) => `<a href="/assets/${encodeURIComponent(c.id)}">${escapeHtml(c.name || c.id)}</a>`).join(', '));
  }
  $('datasheet-hierarchy').innerHTML = parts.join(' · ');

  const rows = [];
  const seen = new Set();
  for (const d of defs) {
    seen.add(d.key);
    const v = attrs[d.key];
    const ver = av[d.key] || {};
    rows.push(`<tr${d.active === false ? ' class="of-deleted"' : ''}>
      <td>${escapeHtml(d.label)}${d.unit ? ` (${escapeHtml(d.unit)})` : ''}${d.active === false ? ' <span class="of-badge">inactivo</span>' : ''}</td>
      <td>${v === null || v === undefined ? '<span class="of-progress-legend">vacío</span>' : escapeHtml(String(v))}</td>
      <td>${attrVerificationBadge(ver.status)}</td>
      <td>${formatDate(ver.verified_at)}</td>
    </tr>`);
  }
  for (const [k, v] of Object.entries(attrs)) {
    if (seen.has(k)) continue;
    const ver = av[k] || {};
    rows.push(`<tr><td>${escapeHtml(k)} <span class="of-badge">fuera de tipo</span></td>
      <td>${escapeHtml(String(v))}</td><td>${attrVerificationBadge(ver.status)}</td><td>${formatDate(ver.verified_at)}</td></tr>`);
  }
  $('datasheet').innerHTML = rows.join('');

  const relevant = defs.filter((d) => d.active !== false && d.verify_in_field !== false && (attrs[d.key] != null || d.required));
  const done = relevant.filter((d) => ['confirmed', 'corrected', 'unverifiable'].includes((av[d.key] || {}).status)).length;
  const pct = relevant.length ? Math.round(100 * done / relevant.length) : (asset.verified_at ? 100 : 0);
  $('verify-progress').value = pct;
  $('verify-progress-legend').textContent = relevant.length
    ? `${done}/${relevant.length} atributos verificados en terreno (${pct}%)`
    : '';
}

function renderIdentifiers(identifiers) {
  if (!identifiers.length) return;
  show('identifiers-section');
  $('identifiers').innerHTML = identifiers
    .map((i) => `<span class="of-badge">${i.type.toUpperCase()}: ${escapeHtml(i.value)}</span>`)
    .join('');
}

function renderSessions(sessions) {
  if (!sessions.length) {
    show('sessions-section');
    emptyState($('sessions'), { icon: '🚶', title: 'Sin sesiones registradas para este activo.' });
    return;
  }
  show('sessions-section');
  const container = $('sessions');
  container.innerHTML = '';
  for (const s of sessions) {
    const card = document.createElement('div');
    card.className = 'of-card' + (s._deleted_at ? ' of-deleted' : '');
    card.style.marginBottom = '0.5rem';
    card.innerHTML = `<a href="/sessions/${encodeURIComponent(s.id)}">
      <strong>${formatDate(s.started_at)}</strong> — operador: ${escapeHtml(s.operator || 'n/d')}
      <div class="of-popup-id">${escapeHtml(s.id)}${s._deleted_at ? ' · <em>eliminada</em>' : ''}</div>
    </a>`;
    card.appendChild(itemActions({ id: s.id, kind: 'sesión', deleted: Boolean(s._deleted_at), onChanged: load }));
    container.appendChild(card);
  }
}

// --- Edición en línea (ADR-0021) ---

let _editMediaDialog = null;

function editMediaDialog(mediaItem) {
  if (!_editMediaDialog) {
    _editMediaDialog = document.createElement('dialog');
    _editMediaDialog.className = 'of-card';
    _editMediaDialog.style.maxWidth = '30rem';
    _editMediaDialog.innerHTML = `
      <h3 class="of-section-title">Editar medio</h3>
      <div class="of-field"><label>Leyenda</label><textarea maxlength="500" rows="2" data-caption></textarea></div>
      <div class="of-field"><label>Categoría</label><select data-category></select></div>
      <h4 class="of-section-title" style="margin-top:var(--of-space-3)">Mover a otro activo</h4>
      <div class="of-field"><input type="search" placeholder="Buscar activo" maxlength="100" data-q></div>
      <div class="of-field"><select data-target size="5" style="width:100%"></select></div>
      <div class="of-actions">
        <button class="of-btn primary" data-save>Guardar</button>
        <button class="of-btn" data-close>Cancelar</button>
      </div>`;
    const dlg = _editMediaDialog;
    dlg.querySelector('[data-close]').addEventListener('click', () => dlg.close());
    dlg.querySelector('[data-q]').addEventListener('input', async (e) => {
      const assets = await searchAssetsApi(e.target.value);
      const current = dlg.dataset.currentAsset || '';
      const opts = ['<option value="">— sin cambio —</option>'].concat(
        assets
          .filter((a) => a.status !== 'decommissioned' && a.id !== current)
          .map((a) => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name || a.id)} (${escapeHtml(a.id)})</option>`),
      );
      dlg.querySelector('[data-target]').innerHTML = opts.join('');
    });
    document.body.appendChild(dlg);
  }
  const dlg = _editMediaDialog;
  const md = mediaItem.metadata || {};
  dlg.dataset.currentAsset = mediaItem.asset_id || '';
  dlg.querySelector('[data-caption]').value = md.caption || '';
  const cats = photoCategoriesFor(_assetType);
  const sel = dlg.querySelector('[data-category]');
  const opts = ['<option value="">— sin categoría —</option>']
    .concat(cats.map((c) => `<option value="${escapeHtml(c.key)}">${escapeHtml(c.label)}</option>`));
  if (md.category && !cats.some((c) => c.key === md.category)) {
    opts.push(`<option value="${escapeHtml(md.category)}">${escapeHtml(md.category_label || md.category)}</option>`);
  }
  sel.innerHTML = opts.join('');
  sel.value = md.category || '';
  const q = dlg.querySelector('[data-q]');
  q.value = '';
  q.dispatchEvent(new Event('input'));
  dlg.querySelector('[data-save]').onclick = async () => {
    const caption = dlg.querySelector('[data-caption]').value.trim();
    const category = sel.value || '';
    const target = dlg.querySelector('[data-target]').value;
    const meta = { ...(mediaItem.metadata || {}) };
    if (caption) meta.caption = caption.slice(0, 500); else delete meta.caption;
    if (category) {
      meta.category = category;
      meta.category_label = sel.selectedOptions[0]?.textContent || category;
    } else {
      delete meta.category;
      delete meta.category_label;
    }
    const changes = { metadata: meta };
    if (target && target !== mediaItem.asset_id) changes.asset_id = target;
    try {
      await apiPatch(mediaItem.id, changes, 'edición desde expediente');
      dlg.close();
      load();
    } catch (e) { alert('No se pudo guardar: ' + e.message); }
  };
  dlg.showModal();
}

function renderMediaFilters() {
  const box = $('media-filters');
  const cats = [...new Set(_mediaItems.map((m) => (m.metadata || {}).category).filter(Boolean))];
  if (!cats.length) { box.innerHTML = ''; return; }
  const chip = (key, label) =>
    `<button type="button" class="of-chip ${_mediaCategory === key ? 'active' : ''}" data-cat="${escapeHtml(key)}">${escapeHtml(label)}</button>`;
  box.innerHTML = chip('', 'Todas') + cats
    .map((k) => {
      const labels = new Set(_mediaItems.filter((m) => (m.metadata || {}).category === k).map((m) => (m.metadata || {}).category_label || k));
      return chip(k, [...labels].join('/'));
    })
    .join('');
  box.querySelectorAll('[data-cat]').forEach((b) =>
    b.addEventListener('click', () => { _mediaCategory = b.dataset.cat; renderMediaCards(); }),
  );
}

function renderMedia(mediaItems) {
  _mediaItems = mediaItems;
  _mediaCategory = '';
  if (!mediaItems.length) {
    show('media-section');
    $('media-filters').innerHTML = '';
    emptyState($('media'), { icon: '📷', title: 'Sin medios capturados para este activo.' });
    return;
  }
  show('media-section');
  renderMediaFilters();
  renderMediaCards();
}

function renderMediaCards() {
  renderMediaFilters();
  const container = $('media');
  container.innerHTML = '';
  const items = _mediaCategory
    ? _mediaItems.filter((m) => (m.metadata || {}).category === _mediaCategory)
    : _mediaItems;
  for (const m of items) {
    const wrap = document.createElement('div');
    if (m._deleted_at) wrap.className = 'of-deleted';
    wrap.appendChild(mediaCard(m));
    wrap.appendChild(itemActions({
      id: m.id, kind: 'medio', deleted: Boolean(m._deleted_at),
      onEdit: () => editMediaDialog(m), onChanged: load,
    }));
    container.appendChild(wrap);
  }
  if (!items.length) emptyState(container, { icon: '📷', title: 'Sin medios de esta categoría.' });
}

function renderObservations(observations) {
  if (!observations.length) return;
  show('observations-section');
  const tbody = $('observations');
  tbody.innerHTML = '';
  for (const o of observations) {
    const tr = document.createElement('tr');
    if (o._deleted_at) tr.className = 'of-deleted';
    tr.innerHTML = `<td>${formatDate(o.observed_at)}</td><td>${escapeHtml(o.type)}</td><td>${escapeHtml(String(o.value))}</td><td>${escapeHtml(o.unit || '—')}</td>`;
    const td = document.createElement('td');
    td.appendChild(itemActions({
      id: o.id, kind: 'observación', deleted: Boolean(o._deleted_at),
      onEdit: () => editObservationRow(tr, o), onChanged: load,
    }));
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

function editObservationRow(tr, obs) {
  tr.innerHTML = `
    <td>${formatDate(obs.observed_at)}</td>
    <td><input data-f="type" value="${escapeHtml(obs.type || '')}" maxlength="60" style="width:6rem"></td>
    <td><input data-f="value" value="${escapeHtml(String(obs.value ?? ''))}" maxlength="2000" style="width:14rem"></td>
    <td><input data-f="unit" value="${escapeHtml(obs.unit || '')}" maxlength="30" style="width:4rem"></td>`;
  const td = document.createElement('td');
  const save = document.createElement('button');
  save.className = 'of-btn primary';
  save.textContent = 'Guardar';
  save.onclick = async () => {
    const v = (f) => tr.querySelector(`[data-f="${f}"]`).value;
    try {
      await apiPatch(obs.id, { type: v('type'), value: v('value'), unit: v('unit') || null }, 'edición desde expediente');
      load();
    } catch (e) { alert('No se pudo guardar: ' + e.message); }
  };
  const cancel = document.createElement('button');
  cancel.className = 'of-btn';
  cancel.textContent = 'Cancelar';
  cancel.onclick = load;
  td.append(save, cancel);
  tr.appendChild(td);
}

function renderTranscripts(transcripts) {
  if (!transcripts.length) return;
  show('transcripts-section');
  const container = $('transcripts');
  container.innerHTML = '';
  for (const t of transcripts) {
    const card = document.createElement('div');
    card.className = 'of-card' + (t._deleted_at ? ' of-deleted' : '');
    card.style.marginBottom = '0.5rem';
    card.innerHTML = `<div class="of-badge">motor: ${escapeHtml(t.engine)} · idioma: ${escapeHtml(t.language || '—')}${t._deleted_at ? ' · <em>eliminada</em>' : ''}</div><p data-text>${escapeHtml(t.text)}</p>`;
    card.appendChild(itemActions({
      id: t.id, kind: 'transcripción', deleted: Boolean(t._deleted_at),
      onEdit: () => editTranscriptCard(card, t), onChanged: load,
    }));
    container.appendChild(card);
  }
}

function editTranscriptCard(card, t) {
  const p = card.querySelector('[data-text]');
  const area = document.createElement('textarea');
  area.rows = 4;
  area.maxLength = 10000;
  area.value = t.text;
  area.style.width = '100%';
  p.replaceWith(area);
  const row = document.createElement('div');
  row.className = 'of-actions';
  const save = document.createElement('button');
  save.className = 'of-btn primary';
  save.textContent = 'Guardar';
  save.onclick = async () => {
    try {
      await apiPatch(t.id, { text: area.value }, 'edición desde expediente');
      load();
    } catch (e) { alert('No se pudo guardar: ' + e.message); }
  };
  const cancel = document.createElement('button');
  cancel.className = 'of-btn';
  cancel.textContent = 'Cancelar';
  cancel.onclick = load;
  row.append(save, cancel);
  card.appendChild(row);
}

// Edición de form-response generada desde su plantilla (ADR-0006/0021).
let _formDialog = null;

async function editFormResponse(fr) {
  const template = await apiGetDoc(fr.template_id);
  if (!_formDialog) {
    _formDialog = document.createElement('dialog');
    _formDialog.className = 'of-card';
    _formDialog.style.maxWidth = '32rem';
    _formDialog.innerHTML = `
      <h3 class="of-section-title">Editar respuesta</h3>
      <div data-fields></div>
      <div class="of-actions">
        <button class="of-btn primary" data-save>Guardar</button>
        <button class="of-btn" data-close>Cancelar</button>
      </div>`;
    _formDialog.querySelector('[data-close]').addEventListener('click', () => _formDialog.close());
    document.body.appendChild(_formDialog);
  }
  const fields = template.fields || [];
  const values = fr.values || {};
  _formDialog.querySelector('[data-fields]').innerHTML = fields.map((f) => {
    const v = values[f.key];
    let input;
    if (f.type === 'boolean') {
      input = `<input data-key="${escapeHtml(f.key)}" type="checkbox"${v ? ' checked' : ''}>`;
    } else if (f.type === 'select') {
      input = `<select data-key="${escapeHtml(f.key)}">${(f.options || []).map((o) => `<option${o === v ? ' selected' : ''}>${escapeHtml(o)}</option>`).join('')}</select>`;
    } else if (f.type === 'number') {
      input = `<input data-key="${escapeHtml(f.key)}" type="text" inputmode="decimal" value="${escapeHtml(String(v ?? ''))}">`;
    } else {
      input = `<input data-key="${escapeHtml(f.key)}" type="text" maxlength="2000" value="${escapeHtml(String(v ?? ''))}">`;
    }
    return `<div class="of-field"><label>${escapeHtml(f.label || f.key)}${f.unit ? ` (${escapeHtml(f.unit)})` : ''}</label>${input}</div>`;
  }).join('');
  _formDialog.querySelector('[data-save]').onclick = async () => {
    const out = {};
    for (const el of _formDialog.querySelectorAll('[data-key]')) {
      const f = fields.find((x) => x.key === el.dataset.key);
      if (f.type === 'boolean') out[f.key] = el.checked;
      else if (f.type === 'number') out[f.key] = el.value === '' ? null : Number(el.value.replace(',', '.'));
      else out[f.key] = el.value;
    }
    try {
      await apiPatch(fr.id, { values: out }, 'edición desde expediente');
      _formDialog.close();
      load();
    } catch (e) { alert('No se pudo guardar: ' + e.message); }
  };
  _formDialog.showModal();
}

function renderForms(formResponses) {
  if (!formResponses.length) return;
  show('forms-section');
  const container = $('forms');
  container.innerHTML = '';
  for (const f of formResponses) {
    const card = document.createElement('div');
    card.className = 'of-card' + (f._deleted_at ? ' of-deleted' : '');
    card.style.marginBottom = '0.5rem';
    card.innerHTML = `<div class="of-popup-id">${escapeHtml(f.id)} · plantilla ${escapeHtml(f.template_id)}${f._deleted_at ? ' · <em>eliminada</em>' : ''}</div><pre class="of-log" style="margin:0.4rem 0 0">${escapeHtml(JSON.stringify(f.values, null, 2))}</pre>`;
    card.appendChild(itemActions({
      id: f.id, kind: 'respuesta', deleted: Boolean(f._deleted_at),
      onEdit: () => editFormResponse(f), onChanged: load,
    }));
    container.appendChild(card);
  }
}

function renderHistory(history) {
  if (!history || !history.length) return;
  show('history-section');
  $('history').innerHTML = history
    .map((r) => `<tr>
      <td>${r.revision}</td>
      <td>${escapeHtml(ACTION_LABELS[r.action] || r.action)}</td>
      <td>${escapeHtml(r.source)}${r.batch_id ? ` · ${escapeHtml(r.batch_id)}` : ''}</td>
      <td>${formatDate(r.created_at)}</td>
      <td>${escapeHtml(r.reason || '—')}</td>
      <td class="of-progress-legend">${escapeHtml((r.changed_keys || []).join(', '))}</td>
    </tr>`)
    .join('');
}

async function load() {
  try {
    const url = location.pathname + (showDeleted ? '?include_deleted=true' : '');
    const res = await fetch(url, { headers: { Accept: 'application/json' }, cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'Activo no encontrado' : `Error ${res.status}`);
    const dossier = await res.json();
    _assetType = dossier.asset_type || null;
    renderAssetSummary(dossier.asset, dossier.identifiers);
    renderDatasheet(dossier.asset, dossier.asset_type, dossier.parent || null, dossier.children || []);
    renderIdentifiers(dossier.identifiers);
    renderSessions(dossier.sessions);
    renderMedia(dossier.media_items);
    renderObservations(dossier.observations);
    renderTranscripts(dossier.transcripts);
    renderForms(dossier.form_responses);
    renderHistory(dossier.history);
  } catch (e) {
    emptyState($('asset-summary'), { icon: '⚠️', title: 'No se pudo cargar el expediente.', hint: e.message, cta: { href: '/', label: 'Volver al dashboard' } });
  }
}

$('show-deleted').addEventListener('change', (e) => {
  showDeleted = e.target.checked;
  load();
});

load();
</script>
</body>
</html>
