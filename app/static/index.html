<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenField</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font-family: sans-serif; margin: 1rem; }
  #map { height: 50vh; }
  #gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
  .card { border: 1px solid #ddd; padding: 6px; width: 160px; }
  .card img { width: 100%; height: 100px; object-fit: cover; background: #eee; }
  .card .id { font-size: 0.75rem; color: #555; word-break: break-all; }
  .card .placeholder { height: 100px; background: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 0.75rem; }
  table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; font-size: 0.85rem; text-align: left; }
  th { background: #f5f5f5; }
</style>
</head>
<body>
<h1>OpenField</h1>
<div id="map"></div>
<h2>Medios</h2>
<div id="gallery"></div>
<h2>Registro</h2>
<table>
  <thead><tr><th>ID</th><th>Tipo</th><th>Capturado</th><th>Lon</th><th>Lat</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const map = L.map('map').setView([-33.45, -70.65], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markerGroup = L.featureGroup().addTo(map);

function cell(value) {
  const td = document.createElement('td');
  td.textContent = value == null ? '' : value;
  return td;
}

async function load() {
  const res = await fetch('/documents?entity_type=media-item');
  const docs = await res.json();
  const rows = document.getElementById('rows');
  for (const d of docs) {
    let lon = null, lat = null;
    if (d.geometry && d.geometry.type === 'Point') {
      [lon, lat] = d.geometry.coordinates;
    }
    if (lon != null && lat != null) {
      L.marker([lat, lon]).addTo(markerGroup).bindPopup(d.id);
    }
    // galería
    const card = document.createElement('div');
    card.className = 'card';
    const href = d.assets && d.assets.primary && d.assets.primary.href;
    if (href) {
      const img = document.createElement('img');
      img.src = href;
      img.alt = d.id;
      img.onerror = () => {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.textContent = 'sin imagen';
        img.replaceWith(ph);
      };
      card.appendChild(img);
    }
    const label = document.createElement('div');
    label.className = 'id';
    label.textContent = d.id;
    card.appendChild(label);
    document.getElementById('gallery').appendChild(card);
    // registro (tabla)
    const tr = document.createElement('tr');
    tr.appendChild(cell(d.id));
    tr.appendChild(cell(d.type));
    tr.appendChild(cell((d.captured_at || '').slice(0, 19)));
    tr.appendChild(cell(lon));
    tr.appendChild(cell(lat));
    rows.appendChild(tr);
  }
  if (markerGroup.getLayers().length) {
    map.fitBounds(markerGroup.getBounds().pad(0.3), { maxZoom: 13 });
  }
}
load();
</script>
</body>
</html>
